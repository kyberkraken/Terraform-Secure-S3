name: Terraform Deploy S3

on:
  push:
    branches:
      - main

permissions:
  id-token: write #Required for requesting JWT from Github
  contents: read #Required to checkout code. Required explicitely because permissions block is added, otherwise repo content read is default


jobs:
  terraform:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Debug OIDC Token Subject
        run: |
          ACTIONS_ID_TOKEN=$(curl -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" -s | jq -r '.value')
          echo "JWT Payload:"
          jq -R 'split(".") | .[1] | @base64d | fromjson' <<< "$ACTIONS_ID_TOKEN"

      - name: Configure AWS creds via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: "arn:aws:iam::426501511660:role/GithubAction-Assume-S3"
          aws-region: "us-east-1"
      
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform init
        run: terraform init

      - name: Terraform Apply
        run: terraform apply -auto-approve